name: AppleIntelligenceSummarizer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  AppleIntelligenceSummarizer:
    type: application
    platform: macOS
    sources:
      - path: AppleIntelligenceSummarizer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AppleIntelligenceSummarizer
        PRODUCT_NAME: Apple Intelligence Summarizer
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Apple Intelligence Summarizer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
